<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thai pronunciation cheat sheet</title>
    <link rel="stylesheet" href="./pronunciation-cheat-sheet.css" />
  </head>
  <body>
    <main>
      <h1>Thai pronunciation cheat sheet</h1>
      <div id="intro"></div>
      <p id="error" hidden></p>

      <h2>Words</h2>
      <div class="table-wrap" id="words"></div>
      <p id="missing"></p>

      <h2>Sound inventory</h2>
      <p id="inventory-intro"></p>
      <h3>Initials</h3>
      <div class="table-wrap" id="initials"></div>
      <h3>Finals that are their own sounds</h3>
      <div class="table-wrap" id="finals"></div>
      <h3>Vowels</h3>
      <div class="table-wrap" id="vowels"></div>
      <h3>Tones</h3>
      <div class="table-wrap" id="tones"></div>

      <h2>Sentence-final particles</h2>
      <div id="particles-intro"></div>
      <div class="table-wrap" id="particles"></div>
    </main>
    <script src="./pronunciation-cheat-sheet.js"></script>
  </body>
</html>
